[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wapsi"
version = "0.1.0"
description = "Cause-aware, bounded revenue recovery for Razorpay merchants"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kartik Gupta" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "razorpay>=1.4",
    "openai>=1.30",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # httpx is not imported directly; starlette's TestClient requires it.
    "httpx>=0.27",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wapsi = "wapsi.cli:app"

[tool.setuptools.packages.find]
include = ["wapsi*"]

[tool.setuptools.package-data]
wapsi = ["sim/*.yaml", "api/static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# BLE and SIM are selected deliberately: the codebase carries `noqa` comments that name them,
# and a suppression whose rule is not enabled documents nothing. E501 is not selected — a few
# tables and regexes read better wide than wrapped.
select = ["F", "E4", "E7", "E9", "B", "SIM", "BLE", "UP", "C4", "PIE", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ₹ and en-dashes are content here, not typos.
    "RUF012",                      # Mutable class attrs are fine on the stub gateways.
    "B008",                        # typer.Option in a default is how typer is written.
    "SIM108",                      # An if/else is often clearer than a ternary.
    # `class X(str, Enum)` rather than StrEnum, deliberately. These enums are pydantic fields
    # serialised into the audit log and the committed results; the two base classes differ in
    # what `str()` returns, and swapping them to satisfy a linter would risk the one artefact
    # this project asks to be taken at its word. Every use site says `.value` explicitly.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Fixture defaults are built with dict(key=value) because they read as the keyword arguments
# they are about to become.
"tests/*" = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette's TestClient imports a deprecated anyio alias. Nothing here can fix it, and its
    # traceback was the last thing printed after a clean run, which reads as a failure.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
