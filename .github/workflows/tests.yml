name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # No secrets in CI, deliberately: everything here has to pass with no keys at all.
      - run: python -m pytest -q
      - run: python -m bharpai.cli simulate --n 60 --quiet
        env:
          PYTHONIOENCODING: utf-8
