# Every bound Wapsi operates under, in one file.
#
# Each rule has an id (R01..R41). The engine cites those ids on every allow/deny, the audit log
# stores them, the tests assert on them, and the README renders this file. Change a number here
# and the whole system changes with it: nothing below is duplicated in code.

timezone: Asia/Kolkata

windows:
  # TRAI TCCCPR: promotional and service-explicit messages are delivered in a daytime band only.
  customer_messaging:            # R10
    start: "10:00"
    end: "21:00"
  # RBI Fair Practices Code caps recovery contact at 19:00; intersected with the TRAI band.
  receivables_messaging:         # R11
    start: "10:00"
    end: "19:00"
  # NPCI 2026 execution windows for UPI AutoPay: avoid the 10:00-13:00 and 17:00-21:30 peaks.
  auto_debit:                    # R12
    - ["00:00", "10:00"]
    - ["13:00", "17:00"]
    - ["21:30", "24:00"]
  # RBI e-mandate framework: the customer must be told at least this long before a debit.
  predebit_notice_hours: 24      # R13

# RBI additional-factor-authentication threshold for recurring payments. Above this we never
# auto-retry; we ask the customer to re-authenticate.
afa_threshold_paise: 1500000     # R14

# Retry spacing. The gap and the daily ceiling apply to every re-attempt — charging the same
# instrument twice in two minutes is the behaviour this system exists to replace. Waiting for an
# outage to clear applies only where an outage is the diagnosis.
transient_retry:                 # R16
  min_gap_minutes: 30
  max_per_24h: 3
  wait_for_downtime_resolved: true

caps:
  # Per scenario, because the right cadence differs enormously. Chasing a ₹299 subscription
  # three times in a fortnight is persistent; chasing a ₹5,00,000 invoice three times in a month
  # is negligent. What the fair practices code forbids is harassment, not periodic invoicing.
  nudges_per_case:               # R20
    payment_failed: 3
    checkout_abandoned: 2
    subscription_failed: 3
    overdue_receivable: 5
  nudge_gap_hours:               # R20
    payment_failed: 24
    checkout_abandoned: 24
    subscription_failed: 24
    overdue_receivable: 72
  first_abandon_nudge_delay_minutes: 30
  actions_per_case:              # R21
    payment_failed: 5
    checkout_abandoned: 4
    subscription_failed: 6
    overdue_receivable: 8
  max_age_days:                  # R22
    payment_failed: 14
    checkout_abandoned: 14
    subscription_failed: 14
    overdue_receivable: 30
  customer_messages_per_7d: 5    # R23

economics:                       # R24
  min_amount_for_nudge_paise: 5000
  channel_cost_paise:
    sms: 20
    whatsapp: 80
    email: 2
    voice_stub: 300
  retry_cost_paise: 5
  human_escalation_cost_paise: 5000
  # A chargeback costs the merchant a handling fee on top of the lost sale. Chasing someone who
  # has already been declined for risk, or messaging them at midnight until they complain to
  # their bank, is not free — this is what makes that visible in the net figure.
  dispute_cost_paise: 50000

escalation:
  high_value_paise: 2500000      # R30
  # Escalate only after the automated ladder has genuinely been tried. Handing a case to a human
  # after two messages wastes the cheap attempts that were still available.
  high_value_min_nudges: 3       # R30
  promises_broken: 2             # R31
  on_complaint: true             # R32
  unknown_after_failed_retries: 1  # R33
  llm_denials: 2                 # R34

promise_grace_days: 1            # R41

validator:                       # R40
  # Matched as whole words. An ALL-CAPS entry is matched case-sensitively, which is what keeps
  # the initialism FIR (a police complaint) banned while the Hinglish "fir se" — *again* —
  # stays usable. Word variants are listed rather than matched by prefix, so that "court" does
  # not fire on "courtesy".
  banned_patterns:
    - "legal action"
    - "police"
    - "court"
    - "FIR"
    - "credit score"
    - "cibil"
    - "blacklist"
    - "last warning"
    - "or else"
    - "consequence"
    - "consequences"
    - "fraud"
    - "fraudulent"
    - "seize"
    - "recovery agent"
  required:
    - merchant_name
    - amount
    - link
    - opt_out_line
  max_chars:
    sms: 320
    whatsapp: 600
    email: 2000
    voice_stub: 600
